<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/rl.css"><link rel="stylesheet" href="../assets/app.css"></head><body><div id="x" style="max-width:1200px;margin:10px auto"></div>
<script src="../js/kit/ui.js"></script><script src="../js/kit/code.js"></script><script src="../js/kit/board.js"></script><script src="../js/kit/parts.js"></script><script src="../js/kit/sim.js"></script>
<script>
var X=document.getElementById('x'), W=RL.Board.WIDE; window.SIMS={};
SIMS.servo = RL.Sim.create(X,{title:'servo+lcd', board:{vb:W, parts:{servo:{type:'servo',at:[760,30]}, lcd:{type:'lcd',at:'j10'}}}, servos:{9:'servo'}, lcd:'lcd',
 code:'#include <Servo.h>\n#include <LiquidCrystal.h>\nServo arm;\nLiquidCrystal lcd(7, 8, 9, 10, 11, 12);\nvoid setup() {\n  arm.attach(9);\n  lcd.begin(16, 2);\n  lcd.print("Angle:");\n}\nvoid loop() {\n  for (int a = 0; a <= 180; a += 45) {\n    arm.write(a);\n    lcd.setCursor(0, 1);\n    lcd.print(a);\n    lcd.print("   ");\n    delay(100);\n  }\n}'});
SIMS.seg = RL.Sim.create(X,{title:'595 + seg4', board:{vb:W, parts:{chip:{type:'chip',at:'e10',label:'74HC595'}, seg:{type:'seg4',at:[740,100]}}}, shift:{data:8,clock:10,latch:9}, seg4:{part:'seg',digits:[2,3,4,5]},
 code:'int latch = 9;\nint clk = 10;\nint data = 8;\nint digits[] = {2, 3, 4, 5};\nbyte nums[] = {0x3f, 0x06, 0x5b, 0x4f};\nvoid setup() {\n  pinMode(latch, OUTPUT);\n  pinMode(clk, OUTPUT);\n  pinMode(data, OUTPUT);\n  for (int i = 0; i < 4; i++) {\n    pinMode(digits[i], OUTPUT);\n    digitalWrite(digits[i], HIGH);\n  }\n}\nvoid loop() {\n  for (int i = 0; i < 4; i++) {\n    digitalWrite(latch, LOW);\n    shiftOut(data, clk, MSBFIRST, nums[i]);\n    digitalWrite(latch, HIGH);\n    digitalWrite(digits[i], LOW);\n    delay(4);\n    digitalWrite(digits[i], HIGH);\n  }\n}'});
SIMS.ir = RL.Sim.create(X,{title:'ir+stepper', board:{vb:W, parts:{ir:{type:'ir',at:[760,40]}, st:{type:'stepper',at:[760,250]}}}, ir:{pin:11,part:'ir'}, stepper:'st', serialInput:true,
 code:'#include <IRremote.hpp>\n#include <Stepper.h>\nStepper motor(2048, 8, 10, 9, 11);\nvoid setup() {\n  Serial.begin(9600);\n  IrReceiver.begin(11, ENABLE_LED_FEEDBACK);\n  motor.setSpeed(12);\n}\nvoid loop() {\n  if (IrReceiver.decode()) {\n    int c = IrReceiver.decodedIRData.command;\n    Serial.println(c, HEX);\n    if (c == 0x09) {\n      motor.step(256);\n    }\n    IrReceiver.resume();\n  }\n}'});
SIMS.dht = RL.Sim.create(X,{title:'dht+sonar+motor', board:{vb:W, parts:{dht:{type:'dht',at:[760,30]}, so:{type:'sonar',at:[760,150]}, m:{type:'dcmotor',at:[800,360]}, rl:{type:'relay',at:[880,30]}}}, dht:{pin:2,temp:24,hum:40}, sonar:{trig:12,echo:11,part:'so',cm:30}, motor:{en:5,in1:3,in2:4,part:'m'}, relays:{7:'rl'},
 code:'#include <DHT.h>\nDHT dht(2, DHT11);\nvoid setup() {\n  Serial.begin(9600);\n  dht.begin();\n  pinMode(12, OUTPUT);\n  pinMode(11, INPUT);\n  pinMode(5, OUTPUT); pinMode(3, OUTPUT); pinMode(4, OUTPUT); pinMode(7, OUTPUT);\n}\nvoid loop() {\n  digitalWrite(12, HIGH);\n  delayMicroseconds(10);\n  digitalWrite(12, LOW);\n  long d = pulseIn(11, HIGH);\n  float t = dht.readTemperature();\n  Serial.print(d / 58);\n  Serial.print(" cm ");\n  Serial.println(t);\n  analogWrite(5, 200); digitalWrite(3, HIGH); digitalWrite(4, LOW); digitalWrite(7, HIGH);\n  delay(300);\n}'});
SIMS.joy = RL.Sim.create(X,{title:'joystick+rgb+buzzer', board:{vb:W, parts:{j:{type:'joystick',at:[760,40]}, rgb:{type:'rgb',at:'h5'}, bz:{type:'buzzer',a:'h15',k:'h17',variant:'passive'}}}, joystick:{x:0,y:1,sw:2,part:'j'}, rgb:{part:'rgb',r:9,g:10,b:11}, buzzers:{8:{part:'bz',type:'passive'}},
 code:'void setup() {\n  pinMode(2, INPUT_PULLUP);\n}\nvoid loop() {\n  int x = analogRead(A0);\n  analogWrite(9, map(x, 0, 1023, 0, 255));\n  analogWrite(10, 40);\n  analogWrite(11, 255 - map(x, 0, 1023, 0, 255));\n  if (digitalRead(2) == LOW) {\n    tone(8, 440);\n  } else {\n    noTone(8);\n  }\n  delay(20);\n}'});
</script></body></html>
